name: Key-free development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Install official pinned dependencies
        run: uv sync --locked --python 3.12
      - name: Check development submission without a key or video
        run: uv run --locked python scripts/submission.py check
      - name: Run local runner and packaging tests
        run: uv run --locked pytest
